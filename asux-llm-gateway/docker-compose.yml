version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: asux-llm-gateway:latest
    container_name: asux_llm_gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      # - OPENAI_API_KEY=${OPENAI_API_KEY}  # Will pass from host if set
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

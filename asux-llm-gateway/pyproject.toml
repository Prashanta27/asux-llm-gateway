[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "asux-llm-gateway"
version = "1.0.0"
description = "Production-oriented, provider-independent LLM Gateway V1 for the AsuX AI Workforce platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AsuX AI Engineering" }]
keywords = ["llm", "gateway", "openai-compatible", "fastapi", "asux"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
asux-llm-gateway = "asux_llm_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asux_llm_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/asux_llm_gateway", "README.md", "pyproject.toml"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "live: calls a real LLM provider; runs only when ASUX_RUN_LIVE_TESTS=1",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "N",     # pep8-naming
  "S",     # bandit (security)
  "BLE",   # blind except
  "A",     # builtin shadowing
  "C4",    # comprehensions
  "SIM",   # simplify
  "PT",    # pytest style
  "ASYNC", # async pitfalls
  "T20",   # print statements
  "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and dummy credentials.
"tests/**" = ["S101", "S105", "S106"]
# Examples are CLI demos and print to stdout by design.
"examples/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["asux_llm_gateway"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
